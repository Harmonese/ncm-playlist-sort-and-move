name: Build userscript

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'build.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and verify userscript
        run: npm run verify

      - name: Commit generated userscript
        run: |
          if git diff --quiet -- ncm-playlist-sort-and-move.user.js; then
            echo "Generated userscript is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ncm-playlist-sort-and-move.user.js
          git commit -m "build: update userscript"
          git push
